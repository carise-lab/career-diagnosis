<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>キャリア診断ツール</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic',sans-serif;background:#f5f5f3;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:20px 16px}
#wrap{width:100%;max-width:680px;display:flex;flex-direction:column;gap:12px}
#title-card{background:#fff;border-radius:16px;padding:24px;border:1px solid #e8e8e4;text-align:center}
#title-card h1{font-size:20px;font-weight:600;color:#1a1a1a;margin-bottom:6px}
#title-card p{font-size:13px;color:#666;line-height:1.6}
#steps-bar{display:flex;gap:6px;overflow-x:auto;padding:2px}
.sp{font-size:11px;padding:4px 12px;border-radius:20px;border:1px solid #ddd;color:#888;background:#fff;white-space:nowrap;transition:all .2s;font-weight:400}
.sp.active{background:#1a1a2e;color:#fff;border-color:#1a1a2e;font-weight:500}
.sp.done{background:#e8f5e9;color:#2e7d32;border-color:#a5d6a7}
#chat-box{background:#fff;border-radius:16px;border:1px solid #e8e8e4;overflow:hidden;display:flex;flex-direction:column;min-height:420px}
#msgs{flex:1;overflow-y:auto;padding:20px 16px;display:flex;flex-direction:column;gap:12px;max-height:400px}
.msg{display:flex;gap:10px;align-items:flex-start}
.msg.ai{align-self:flex-start;max-width:90%}
.msg.usr{align-self:flex-end;flex-direction:row-reverse;max-width:85%}
.av{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0}
.ai .av{background:#e8eaf6;color:#3949ab}
.usr .av{background:#e8f5e9;color:#2e7d32}
.bbl{padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.7;white-space:pre-wrap}
.ai .bbl{background:#f7f7f5;color:#1a1a1a;border:1px solid #eee;border-top-left-radius:4px}
.usr .bbl{background:#1a1a2e;color:#fff;border-top-right-radius:4px}
#choices-area{padding:12px 16px;display:flex;flex-wrap:wrap;gap:8px;border-top:1px solid #f0f0ee;min-height:60px;align-content:flex-start}
.cb{font-size:13px;padding:7px 14px;border-radius:20px;border:1px solid #ddd;background:#fff;color:#1a1a1a;cursor:pointer;transition:all .15s;line-height:1.4;text-align:left}
.cb:hover{background:#f5f5f3;border-color:#aaa}
.cb.sel{background:#e8eaf6;color:#1a237e;border-color:#9fa8da}
#input-row{display:flex;gap:8px;padding:12px 16px;border-top:1px solid #f0f0ee}
#inp{flex:1;font-size:13px;padding:9px 13px;border-radius:10px;border:1px solid #ddd;background:#fff;color:#1a1a1a;font-family:inherit}
#inp:focus{outline:none;border-color:#9fa8da}
#sbtn{padding:9px 18px;border-radius:10px;border:none;background:#1a1a2e;color:#fff;cursor:pointer;font-size:13px;font-family:inherit}
#sbtn:hover{background:#2d2d4e}
.typing{display:flex;gap:4px;padding:10px 14px;align-items:center}
.dot{width:6px;height:6px;border-radius:50%;background:#bbb;animation:bounce 1.2s infinite}
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}
.rc{background:#f7f7f5;border:1px solid #eee;border-radius:14px;padding:16px;font-size:13px;line-height:1.7;width:100%}
.rc h3{font-size:14px;font-weight:600;margin-bottom:12px;color:#1a1a1a}
.tag{display:inline-block;font-size:11px;padding:3px 10px;border-radius:20px;margin:2px 3px 2px 0;font-weight:500}
.tb{background:#e8eaf6;color:#1a237e}
.tg{background:#e8f5e9;color:#1b5e20}
.ta{background:#fff3e0;color:#e65100}
.tp{background:#fce4ec;color:#880e4f}
.sec{margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid #eee}
.sec:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.sl{font-size:11px;color:#888;margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.restart-btn{font-size:13px;padding:10px 18px;border-radius:10px;border:1px solid #ddd;background:#fff;color:#1a1a1a;cursor:pointer;margin-top:12px;width:100%;font-family:inherit}
.restart-btn:hover{background:#f5f5f3}
.progress{font-size:11px;color:#aaa;padding:8px 16px;text-align:right;border-top:1px solid #f0f0ee}
#free-inp{font-size:13px;padding:7px 13px;border-radius:20px;border:1px solid #ddd;background:#fff;color:#1a1a1a;width:100%;margin-top:4px;font-family:inherit}
#free-inp:focus{outline:none;border-color:#9fa8da}
.confirm-btn{font-size:13px;padding:7px 14px;border-radius:20px;border:1px solid #a5d6a7;background:#e8f5e9;color:#1b5e20;cursor:pointer;width:100%;text-align:left;margin-top:4px}
</style>
</head>
<body>
<div id="wrap">
  <div id="title-card">
    <h1>🧭 キャリア診断ツール</h1>
    <p>価値観・興味・強み・理想の生活<br>4ステップで、あなたのキャリア軸を言語化する</p>
  </div>
  <div id="steps-bar">
    <div class="sp active" id="s1">① 価値観</div>
    <div class="sp" id="s2">② 興味</div>
    <div class="sp" id="s3">③ 強み</div>
    <div class="sp" id="s4">④ 理想の生活</div>
    <div class="sp" id="s5">🎯 結果</div>
  </div>
  <div id="chat-box">
    <div id="msgs"></div>
    <div id="choices-area"></div>
    <div id="input-row">
      <input id="inp" type="text" placeholder="自由に入力することもできます..." />
      <button id="sbtn">送信</button>
    </div>
  </div>
  <div style="font-size:11px;color:#aaa;text-align:center;padding:4px 0">所要時間：約8〜10分　|　スマホ・PCどちらでもOK</div>
</div>

<script>
const SC={step:1,sub:0,val:{達成感:0,独立性:0,評価認知:0,人間関係:0,社会貢献:0,労働条件:0},int:{R:0,I:0,A:0,S:0,E:0,C:0},str:{実行力:0,影響力:0,人間関係構築力:0,戦略的思考力:0},life:{short:'',mid:'',long:'',now:''}};

const FLOW={
  1:[
    {q:'はじめまして！\n\nこのツールは「価値観・興味・強み・理想の生活」の4ステップで、あなたに合った仕事環境を言語化していきます。所要時間は約8〜10分です。\n\nまず「価値観」から。仕事をしていて一番「合わないな」と感じた経験はどれですか？',ch:['数字・ノルマに毎日追われた','誰も助けてくれない孤独感があった','同じ作業の繰り返しで成長感がなかった','頑張っても評価・感謝されなかった','やり方を全部決められて自分で動けなかった','誠実にできない場面があった'],multi:false},
    {q:'逆に「この環境は最高だ！」と感じた瞬間に近いのはどれですか？',ch:['目標達成・数字で成果が出た','チームで協力して何かを成し遂げた','自分のペースで仕事を進められた','人から感謝・評価された','誰かの役に立てる実感があった','安定して長く続けられる環境だった'],multi:false},
    {q:'仕事を選ぶとき「これだけは絶対に譲れない」条件を選んでください。（複数OK）',ch:['成果が収入・評価に直結する','自分で仕事の進め方を決められる','助け合えるチームワークがある','社会的に意味を感じられる','安定した働き方（時間・休日）','人の成長に関わり続けられる'],multi:true},
    {q:'仕事で「納得できない」と感じるのはどんなときですか？',ch:['会社の方針や文化が自分と合わないとき','スピードより丁寧さを求めているのに逆のとき','個人プレーを求められ協力しにくいとき','頑張りが数字に反映されないとき'],multi:false}
  ],
  2:[
    {q:'価値観が見えてきました！次は「興味」です。\n\n同じ給与・時間の仕事でも、興味に合うかどうかで満足度と成長速度が大きく変わります。\n\nどちらをより「やってみたい」と感じますか？',ch:['A: データを分析して仮説を検証する','B: 人に寄り添い課題を一緒に解決する'],multi:false},
    {q:'次はどちらですか？',ch:['A: ゼロから企画・表現物を作り上げる','B: ルールや手順に沿って正確に処理する'],multi:false},
    {q:'次はどちらですか？',ch:['A: 人や組織を動かして大きな成果を出す','B: モノや仕組みを手を動かして実際に作る'],multi:false},
    {q:'「ついつい時間を忘れてしまう」に近い経験はどれですか？',ch:['なぜうまくいかないのか原因を調べているとき','人の話を聞いて一緒に考えているとき','新しいアイデアやコンテンツを作っているとき','目標に向けてチームを引っ張っているとき','データや数字を整理・整頓しているとき'],multi:false}
  ],
  3:[
    {q:'興味のタイプも分かってきました！次は「強み」です。\n\n強みとは「努力しなくても自然にやってしまうこと」です。\n\n職場でついやってしまうことに近いのはどれですか？',ch:['やることをリスト化して確実に片付ける','困っている人に自然と声をかけてしまう','「なぜ？」と原因・仕組みを考え続ける','「こうすればもっと良くなる」と改善策を出してしまう','その場の雰囲気を明るくしたり盛り上げたりしてしまう'],multi:false},
    {q:'チームで仕事するとき、気づいたら担っている役割はどれですか？',ch:['スケジュール・タスク管理をまとめる役','話しやすい雰囲気をつくるサポート役','戦略・アイデアを出す参謀役','みんなを巻き込んで引っ張るリーダー役'],multi:false},
    {q:'「しんどいな」と思いながらも気づいたらやり続けていることは？',ch:['最後まできっちりやり抜くこと','人の悩みを聞き続けること','情報を整理・分析し続けること','新しいことを考え続けること','周りのモチベーションを上げ続けること'],multi:false},
    {q:'他の人に「なんでそんなに◯◯できるの？」と言われたことに近いのは？',ch:['ミスなく丁寧にこなせること','誰とでも自然に仲良くなれること','論理的に筋道を立てて考えられること','人を動かしてチームをまとめられること'],multi:false}
  ],
  4:[
    {q:'最後は「理想の生活」です。\n\n理想と現状のギャップから「今何をすべきか」が見えてきます。\n\n短期（1〜2年後）、どんな働き方をしていたいですか？',ch:['今より収入を上げて安定させたい','スキルを磨いてキャリアアップしたい','もっと自分の時間・裁量がほしい','副業・複数収入源を持ちたい','転職して新しい環境に移りたい'],multi:false,free:true},
    {q:'中期（3〜5年後）はどんな生活をイメージしていますか？',ch:['マネジメント・リーダーポジションに就く','専門家として独立・フリーに近い形で働く','副業が軌道に乗り収入の柱を増やす','ライフイベントと両立できる環境をつくる','起業・事業を立ち上げる'],multi:false,free:true},
    {q:'長期（5年以上先）の理想は？どれくらいの収入・働き方をイメージしていますか？',ch:['年収800万〜1000万を実現したい','場所・時間を選ばず働けるようにしたい','自分のブランド・事業を持ちたい','仕事とプライベートのバランスを最優先にしたい','社会への影響力を持つポジションに就きたい'],multi:false,free:true},
    {q:'今の状況を一言で表すと？',ch:['仕事は安定しているが成長実感がない','やりがいはあるが収入・評価が不満','転職を考えているが軸が決まっていない','副業・独立を視野に入れて動き始めている','現状に満足しており更なる成長を目指している'],multi:false}
  ]
};

const VM={'数字・ノルマに毎日追われた':'達成感','誰も助けてくれない孤独感があった':'人間関係','同じ作業の繰り返しで成長感がなかった':'達成感','頑張っても評価・感謝されなかった':'評価認知','やり方を全部決められて自分で動けなかった':'独立性','誠実にできない場面があった':'社会貢献','目標達成・数字で成果が出た':'達成感','チームで協力して何かを成し遂げた':'人間関係','自分のペースで仕事を進められた':'独立性','人から感謝・評価された':'評価認知','誰かの役に立てる実感があった':'社会貢献','安定して長く続けられる環境だった':'労働条件','成果が収入・評価に直結する':'評価認知','自分で仕事の進め方を決められる':'独立性','助け合えるチームワークがある':'人間関係','社会的に意味を感じられる':'社会貢献','安定した働き方（時間・休日）':'労働条件','人の成長に関わり続けられる':'社会貢献','会社の方針や文化が自分と合わないとき':'社会貢献','スピードより丁寧さを求めているのに逆のとき':'独立性','個人プレーを求められ協力しにくいとき':'人間関係','頑張りが数字に反映されないとき':'評価認知'};
const IM={'A: データを分析して仮説を検証する':{I:2},'B: 人に寄り添い課題を一緒に解決する':{S:2},'A: ゼロから企画・表現物を作り上げる':{A:2,E:1},'B: ルールや手順に沿って正確に処理する':{C:2},'A: 人や組織を動かして大きな成果を出す':{E:2},'B: モノや仕組みを手を動かして実際に作る':{R:2},'なぜうまくいかないのか原因を調べているとき':{I:2},'人の話を聞いて一緒に考えているとき':{S:2},'新しいアイデアやコンテンツを作っているとき':{A:2},'目標に向けてチームを引っ張っているとき':{E:2},'データや数字を整理・整頓しているとき':{C:2}};
const STM={'やることをリスト化して確実に片付ける':'実行力','困っている人に自然と声をかけてしまう':'人間関係構築力','「なぜ？」と原因・仕組みを考え続ける':'戦略的思考力','「こうすればもっと良くなる」と改善策を出してしまう':'戦略的思考力','その場の雰囲気を明るくしたり盛り上げたりしてしまう':'影響力','スケジュール・タスク管理をまとめる役':'実行力','話しやすい雰囲気をつくるサポート役':'人間関係構築力','戦略・アイデアを出す参謀役':'戦略的思考力','みんなを巻き込んで引っ張るリーダー役':'影響力','最後まできっちりやり抜くこと':'実行力','人の悩みを聞き続けること':'人間関係構築力','情報を整理・分析し続けること':'戦略的思考力','新しいことを考え続けること':'戦略的思考力','周りのモチベーションを上げ続けること':'影響力','ミスなく丁寧にこなせること':'実行力','誰とでも自然に仲良くなれること':'人間関係構築力','論理的に筋道を立てて考えられること':'戦略的思考力','人を動かしてチームをまとめられること':'影響力'};

const msgsEl=document.getElementById('msgs'),choicesEl=document.getElementById('choices-area'),inpEl=document.getElementById('inp'),sbtnEl=document.getElementById('sbtn');

function scroll(){msgsEl.scrollTop=msgsEl.scrollHeight}
function addMsg(text,who){
  const w=document.createElement('div');w.className=`msg ${who}`;
  const av=document.createElement('div');av.className='av';av.textContent=who==='ai'?'AI':'あ';
  const b=document.createElement('div');b.className='bbl';b.textContent=text;
  w.appendChild(av);w.appendChild(b);msgsEl.appendChild(w);scroll();
}
function showTyping(){
  const w=document.createElement('div');w.className='msg ai';w.id='typ';
  const av=document.createElement('div');av.className='av';av.textContent='AI';
  const b=document.createElement('div');b.className='bbl typing';
  [1,2,3].forEach(()=>{const d=document.createElement('div');d.className='dot';b.appendChild(d)});
  w.appendChild(av);w.appendChild(b);msgsEl.appendChild(w);scroll();
}
function rmTyping(){const t=document.getElementById('typ');if(t)t.remove()}

function setChoices(items,multi,free){
  choicesEl.innerHTML='';
  const sel=new Set();
  items.forEach(label=>{
    const btn=document.createElement('button');btn.className='cb';btn.textContent=label;
    btn.onclick=()=>{
      if(!multi){handleChoice(label);}
      else{
        if(sel.has(label)){sel.delete(label);btn.classList.remove('sel');}
        else{sel.add(label);btn.classList.add('sel');}
        updateConfirm(sel);
      }
    };
    choicesEl.appendChild(btn);
  });
  if(free){
    const fi=document.createElement('input');fi.id='free-inp';fi.type='text';fi.placeholder='上記以外は自由に入力...';
    fi.onkeydown=e=>{if(e.key==='Enter'&&fi.value.trim()){handleChoice(fi.value.trim());fi.value=''}};
    choicesEl.appendChild(fi);
  }
  if(multi){
    const c=document.createElement('button');c.id='mc';c.className='confirm-btn';
    c.textContent='選択を確定する →';
    c.onclick=()=>{if(sel.size>0)handleChoice(Array.from(sel).join('・'))};
    choicesEl.appendChild(c);
  }
}
function updateConfirm(sel){const c=document.getElementById('mc');if(c)c.textContent=sel.size>0?`${Array.from(sel).join('・')} を確定 →`:'選択を確定する →';}
function clearChoices(){choicesEl.innerHTML=''}
function updateSteps(){
  ['s1','s2','s3','s4','s5'].forEach((id,i)=>{
    const el=document.getElementById(id);el.className='sp';
    if(i+1<SC.step)el.classList.add('done');
    else if(i+1===SC.step)el.classList.add('active');
  });
}
function handleChoice(val){addMsg(val,'usr');clearChoices();processAnswer(val)}
function processAnswer(val){
  const s=SC.step,sub=SC.sub;
  if(s===1){
    val.split('・').forEach(item=>{
      const v=VM[item.trim()];
      if(v){if(sub===0)SC.val[v]-=2;else if(sub===1)SC.val[v]+=3;else SC.val[v]+=2;}
    });
  }else if(s===2){const m=IM[val];if(m)Object.entries(m).forEach(([k,v])=>SC.int[k]+=v);}
  else if(s===3){const sv=STM[val];if(sv)SC.str[sv]+=1;}
  else if(s===4){if(sub===0)SC.life.short=val;else if(sub===1)SC.life.mid=val;else if(sub===2)SC.life.long=val;else SC.life.now=val;}
  SC.sub++;
  setTimeout(()=>{showTyping();setTimeout(()=>{rmTyping();nextQ()},750)},200);
}
const TRANS={2:'価値観の傾向が見えてきました！\n\n次は「興味」です。同じ条件の仕事でも、興味が合うかどうかで満足度と成長速度が大きく変わります。',3:'興味タイプが分かってきました！\n\n次は「強み」です。強みとは「努力しなくても自然にやってしまうこと」— スキルや資格とは違います。',4:'強みの輪郭が見えてきました！\n\n最後は「理想の生活」を描きます。理想と現状のギャップから「今何をすべきか」が見えてきます。'};

function nextQ(){
  const s=SC.step,sub=SC.sub,sf=FLOW[s];
  if(sf&&sub<sf.length){
    const q=sf[sub];addMsg(q.q,'ai');setChoices(q.ch,q.multi||false,q.free||false);
  }else{
    SC.step++;SC.sub=0;updateSteps();
    if(SC.step<=4){addMsg(TRANS[SC.step],'ai');setTimeout(()=>{showTyping();setTimeout(()=>{rmTyping();nextQ()},500)},300);}
    else showResult();
  }
}

function showResult(){
  SC.step=5;updateSteps();
  const topVal=Object.entries(SC.val).sort((a,b)=>b[1]-a[1]).slice(0,3).map(e=>e[0]);
  const iLbl={R:'現実的（R）',I:'研究的（I）',A:'芸術的（A）',S:'社会的（S）',E:'企業的（E）',C:'慣習的（C）'};
  const topInt=Object.entries(SC.int).sort((a,b)=>b[1]-a[1]).slice(0,2).map(e=>iLbl[e[0]]);
  const topStr=Object.entries(SC.str).sort((a,b)=>b[1]-a[1]).slice(0,2).map(e=>e[0]);
  const envMap={達成感:'成果・数字が見える仕事（営業・PM・マーケ）',独立性:'裁量が大きく自分で動ける環境',評価認知:'成果が評価に直結する仕事',人間関係:'チーム・協働中心の仕事',社会貢献:'誰かを支える仕事（教育・支援）',労働条件:'安定・長期継続できる環境'};
  const strDesc={実行力:'やり抜く力・完遂力',影響力:'人を動かすムードメーカー',人間関係構築力:'場をつくるサポーター',戦略的思考力:'先を読む参謀型'};

  addMsg('診断が完了しました！\n結果をまとめます。','ai');
  setTimeout(()=>{
    const w=document.createElement('div');w.className='msg ai';w.style.maxWidth='96%';
    const av=document.createElement('div');av.className='av';av.textContent='AI';
    const card=document.createElement('div');card.className='rc';
    card.innerHTML=`
      <h3>🎯 キャリア診断 結果サマリー</h3>
      <div class="sec">
        <div class="sl">① 大切にしている価値観（TOP3）</div>
        ${topVal.map(v=>`<span class="tag tb">${v}</span>`).join('')}
        <div style="font-size:12px;color:#888;margin-top:6px">→ ${envMap[topVal[0]]||''}</div>
      </div>
      <div class="sec">
        <div class="sl">② 仕事への興味タイプ</div>
        ${topInt.map(v=>`<span class="tag ta">${v}</span>`).join('')}
      </div>
      <div class="sec">
        <div class="sl">③ あなたの強み</div>
        ${topStr.map(v=>`<span class="tag tg">${v}：${strDesc[v]||''}</span>`).join('　')}
      </div>
      <div class="sec">
        <div class="sl">④ 理想の生活ロードマップ</div>
        <div style="font-size:12px;line-height:2;color:#333">
          <span style="color:#aaa">短期：</span>${SC.life.short||'—'}<br>
          <span style="color:#aaa">中期：</span>${SC.life.mid||'—'}<br>
          <span style="color:#aaa">長期：</span>${SC.life.long||'—'}
        </div>
      </div>
      <button class="restart-btn" onclick="location.reload()">🔄 もう一度診断する</button>
    `;
    w.appendChild(av);w.appendChild(card);msgsEl.appendChild(w);scroll();
  },700);
}

inpEl.addEventListener('keydown',e=>{if(e.key==='Enter'&&inpEl.value.trim()){handleChoice(inpEl.value.trim());inpEl.value=''}});
sbtnEl.addEventListener('click',()=>{if(inpEl.value.trim()){handleChoice(inpEl.value.trim());inpEl.value=''}});

setTimeout(()=>{
  addMsg('こんにちは！\n\nキャリア診断ツールへようこそ。\n\n価値観・興味・強み・理想の生活の4ステップで、あなたのキャリア軸を言語化していきます。\n選択肢を選ぶだけでOKです。自由入力も使えます。','ai');
  setTimeout(()=>{showTyping();setTimeout(()=>{rmTyping();nextQ()},600)},500);
},300);
</script>
